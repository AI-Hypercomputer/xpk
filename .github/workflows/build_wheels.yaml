# Note: Name of this file needs to be build_wheels.yaml as this is the value that has been specified in pypi
# If you want to change the name of this file, please update pypi publisher:
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/

name: PyPi releases

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  validate_tag:
    name: Validate Tag Pattern
    runs-on: ubuntu-latest
    steps:
      - name: Check ref
        run: |
          # When workflow is dispatched through workflow_dispatch, it could be launched on branches instead of tags.
          # We want to make sure it is launched with the tag that additionally is a valid version tag.
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::This workflow must be run on a Tag, not a Branch."
            exit 1
          fi

          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match the required pattern v[0-9]+.[0-9]+.[0-9]+"
            exit 1
          fi

  build_wheel:
    needs: [validate_tag]
    uses: ./.github/workflows/reusable_build_wheel.yaml
  approval:
    name: Wait for approval
    needs: [build_wheel]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - run: echo "Deployment approved!"
  github_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [approval]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft=false --prerelease=false
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs: [approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/xpk
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Stage distributions and trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -m venv .exit-gate-venv
          .exit-gate-venv/bin/python -m pip install --upgrade pip twine keyrings.google-artifactregistry-auth
          .exit-gate-venv/bin/python -m twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/xpk--pypi/ \
            --non-interactive \
            --skip-existing \
            dist/*
          cat <<EOF > manifest.json
          {
            "publish_all": true
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/xpk/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
